<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prihlásenie — Admin | Horse.uk s.r.o.</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Prihlasovacia obrazovka admin maketu Horse.uk s.r.o.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="admin-body">
  <div class="admin-login">
    <div class="admin-login-card">
      <a class="logo" href="../">
        <span class="logo-mark">Horse<span>.uk</span></span>
        <span class="logo-sub">s.r.o. · admin</span>
      </a>
      <h1>Prihlásenie</h1>
      <p class="sub">Vizuálny shell. Heslá sa neoverujú — po odoslaní sa otvorí dashboard maketu. Produkčná autentifikácia príde s PHP backendom.</p>
      <form id="admin-login-form" data-dashboard="./dashboard.html" novalidate>
        <div class="form-group">
          <label for="admin-email">E-mail</label>
          <input class="form-control" type="email" id="admin-email" name="email" autocomplete="username" required placeholder="[admin e-mail]">
          <span class="field-error" role="alert">Toto pole je povinné.</span>
        </div>
        <div class="form-group">
          <label for="admin-password">Heslo</label>
          <input class="form-control" type="password" id="admin-password" name="password" autocomplete="current-password" required placeholder="••••••••">
          <span class="field-error" role="alert">Toto pole je povinné.</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Prihlásiť sa</button>
      </form>
      <p class="admin-note">Žiadne verejné write API. Session a hash hesiel — budúci FORPSI modul.</p>
    </div>
  </div>
  <script src="../assets/js/site.js"></script>
</body>
</html>
